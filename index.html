    <script>
      // 调试：?safe=上,右,下,左（CSS 像素）假装有刘海和底部横条（见下面 :root 的 --sat 等四个变量）
      (() => {
        const m = /[?&]safe=([\d.]+),([\d.]+),([\d.]+),([\d.]+)/.exec(location.search);
        if (m) ["--sat", "--sar", "--sab", "--sal"].forEach((k, i) => document.documentElement.style.setProperty(k, m[i + 1] + "px"));
      })();
    </script>
    <style>
      /* 页面的底：画布按 16:9 放，铺不到的空边露出这一层——深紫的夜色里几抹云气，不是黑底，也没有框。
         画面边缘往这层底里淡出，由战斗界面那一层画（src/game/hud.ts 的 .edge）：那边用的是同一张 --surround、按窗口对齐，
         所以云气压到画布边上时也接得上，不会露出一道直线。 */
      /* 安全区（刘海、圆角、底部横条）：各处要让开的地方都读这四个变量（上右下左），不直接写 env()——
         网址带 ?safe=上,右,下,左 时上面的小脚本把它们换成给定的像素数（Chromium 里模拟不出安全区，截图自查用；src/render/safe-area.ts） */
      :root { --sat: env(safe-area-inset-top, 0px); --sar: env(safe-area-inset-right, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); }
      :root { --sur: #2c2334;
        --surround:
          radial-gradient(34% 13% at 3% 18%, rgba(132, 108, 156, 0.24), rgba(132, 108, 156, 0) 72%),
          radial-gradient(30% 11% at 98% 76%, rgba(116, 110, 160, 0.22), rgba(116, 110, 160, 0) 72%),
          radial-gradient(26% 9% at 1% 60%, rgba(104, 122, 156, 0.15), rgba(104, 122, 156, 0) 72%),
          radial-gradient(28% 10% at 100% 34%, rgba(132, 108, 156, 0.15), rgba(132, 108, 156, 0) 72%),
          radial-gradient(40% 12% at 30% 2%, rgba(132, 108, 156, 0.13), rgba(132, 108, 156, 0) 72%),
          radial-gradient(44% 12% at 72% 99%, rgba(104, 122, 156, 0.12), rgba(104, 122, 156, 0) 72%),
          linear-gradient(180deg, #30273a, #2c2334 50%, #282030); }
      html { height: 100%; background: var(--sur); }
      body { margin: 0; height: 100%; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
        background: var(--surround); }
      /* 底上零星几点灵光（静止、很淡），和战场里飘的灵光是一路 */
      body::before { content: ""; position: fixed; inset: 0; pointer-events: none;
        background:
          radial-gradient(circle at 2.5% 12%, rgba(255, 233, 168, 0.5) 0 1px, rgba(255, 233, 168, 0) 2.5px),
          radial-gradient(circle at 4.6% 47%, rgba(124, 196, 196, 0.42) 0 1px, rgba(124, 196, 196, 0) 2.5px),
          radial-gradient(circle at 1.6% 79%, rgba(255, 233, 168, 0.36) 0 1px, rgba(255, 233, 168, 0) 2.2px),
          radial-gradient(circle at 6.4% 93%, rgba(124, 196, 196, 0.3) 0 1px, rgba(124, 196, 196, 0) 2.2px),
          radial-gradient(circle at 97.2% 8%, rgba(124, 196, 196, 0.4) 0 1px, rgba(124, 196, 196, 0) 2.5px),
          radial-gradient(circle at 95.1% 38%, rgba(255, 233, 168, 0.42) 0 1px, rgba(255, 233, 168, 0) 2.5px),
          radial-gradient(circle at 98.3% 64%, rgba(255, 233, 168, 0.32) 0 1px, rgba(255, 233, 168, 0) 2.2px),
          radial-gradient(circle at 93.8% 90%, rgba(124, 196, 196, 0.36) 0 1px, rgba(124, 196, 196, 0) 2.2px),
          radial-gradient(circle at 23% 3.2%, rgba(255, 233, 168, 0.34) 0 1px, rgba(255, 233, 168, 0) 2.2px),
          radial-gradient(circle at 61% 1.8%, rgba(124, 196, 196, 0.34) 0 1px, rgba(124, 196, 196, 0) 2.2px),
          radial-gradient(circle at 38% 97.4%, rgba(124, 196, 196, 0.3) 0 1px, rgba(124, 196, 196, 0) 2.2px),
          radial-gradient(circle at 79% 96.6%, rgba(255, 233, 168, 0.36) 0 1px, rgba(255, 233, 168, 0) 2.2px); }
      /* 画布在扣掉安全区的那块里居中（大小由 src/render/stage.ts 的 fitCanvas 按同一块算） */
      #stage { position: fixed; inset: 0; box-sizing: border-box; padding: var(--sat) var(--sar) var(--sab) var(--sal); display: flex; align-items: center; justify-content: center; }
      #stage canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }

      /* 首次载入画面（2026-11-12，docs/deploy.md「首次载入与后台预载」）：书法「封神幸存者」、一道像卷轴展开的金线、一行小字。
         主程序和字体下完之前就看得到，所以不靠字体文件——字是内联的楷书轮廓（tools/fonts/boot-glyphs.py）。
         进度是真的：下面的脚本按 window.__FS_LOAD（构建时写进来的首屏文件清单，tools/vite-load-plan.ts）数已经下完的字节。
         0.3 秒内就下完的（有缓存）根本不出现；出来了就盖在标题页上面，标题页挂上之后线走满、淡出（main.ts 调 __fsBoot.finish）。 */
      #boot { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none;
        background: var(--surround); opacity: 0; animation: bootin 0.45s ease-out 0.3s forwards; --p: 0; }
      #boot .t { display: block; height: clamp(34px, 9vmin, 66px); }
      #boot .ln { position: relative; width: clamp(150px, 44vmin, 300px); height: clamp(9px, 2vmin, 12px); margin: clamp(16px, 4.4vmin, 30px) 0 clamp(10px, 2.6vmin, 16px); }
      #boot .ln i { position: absolute; left: 0; right: 0; top: calc(50% - 1px); height: 2px; }
      /* 底下一道很淡的全长（看得出还有多远）；上面金线从中间往两边展开，两头是淡出去的，不是硬边 */
      #boot .ln .tr { background: linear-gradient(90deg, rgba(217, 205, 187, 0), rgba(217, 205, 187, 0.16) 18%, rgba(217, 205, 187, 0.16) 82%, rgba(217, 205, 187, 0)); }
      #boot .ln .ink { background: linear-gradient(90deg, rgba(224, 168, 58, 0), #e0a83a 9%, #f7dc7a 50%, #e0a83a 91%, rgba(224, 168, 58, 0)); transform: scaleX(var(--p)); will-change: transform; }
      /* 两根轴头跟着展开的两端走 */
      #boot .ln b { position: absolute; top: 0; bottom: 0; width: 2px; border-radius: 1px; background: #c99a4e; opacity: 0.85; left: calc(50% - 1px); transform: translateX(calc(var(--p) * var(--half) * var(--dir))); will-change: transform; }
      #boot .ln .l { --dir: -1; }
      #boot .ln .r { --dir: 1; }
      #boot .s { display: block; height: clamp(11px, 2.7vmin, 16px); fill: #a99c93; }
      #boot.again .s { visibility: hidden; }
      @keyframes bootin { to { opacity: 1; } }

      /* 操作提示：平时不显示，进了局由 src/main.ts 的 replayHint 亮 6 秒。键鼠和触屏各一句。
         字垫在一条四边都软的墨底上（压在战场上也看得清；和战斗界面的墨底是一路，见 src/game/ink-band.ts）。
         这时主程序早已注入了字体（src/game/fonts.ts），所以直接用 --font-text。 */
      #hint { opacity: 0; position: fixed; left: 0; right: 0; bottom: max(8px, var(--sab)); padding: 0 12px; text-align: center; pointer-events: none; transition: opacity 1.5s;
        font: clamp(14px, calc(1.6vh + 4px), 20px) / 1.4 var(--font-text, serif); letter-spacing: 0.06em; color: #efe4d0;
        text-shadow: 0 0 0.09em rgba(26, 21, 32, 0.9), 0 0.07em 0.1em rgba(26, 21, 32, 0.85); }
      #hint span { display: inline-block; padding: 0.34em 2.6em 0.4em;
        background: linear-gradient(90deg, rgba(26, 21, 32, 0), rgba(26, 21, 32, 0.2) 5%, rgba(26, 21, 32, 0.46) 11%, rgba(26, 21, 32, 0.6) 18%, rgba(26, 21, 32, 0.6) 82%, rgba(26, 21, 32, 0.46) 89%, rgba(26, 21, 32, 0.2) 95%, rgba(26, 21, 32, 0));
        -webkit-mask-image: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.5) 0.16em, #000 0.32em, #000 calc(100% - 0.32em), rgba(0, 0, 0, 0.5) calc(100% - 0.16em), transparent);
        mask-image: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.5) 0.16em, #000 0.32em, #000 calc(100% - 0.32em), rgba(0, 0, 0, 0.5) calc(100% - 0.16em), transparent); }
      #hint .t { display: none; }
      @media (pointer: coarse) { #hint .k { display: none; } #hint .t { display: inline-block; } }

      /* 「窗口太小了」：只在电脑上、窗口小到连 480×270 都放不下时盖住整屏（这时战斗界面会通知主循环暂停，见 hud.ts 的 onObscured；
         过场也停着等，cutscene.ts 里同一个条件）。那时字体早已下完，直接用 --font-title / --font-text。
         手机、平板竖着拿不再盖提示（2026-11-11 用户：横竖屏都要能玩）：竖屏时整个游戏按横屏的样子等比缩小、居中，上下露出页面的底。 */
      #rotate { display: none; position: fixed; inset: 0; z-index: 10; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: inherit; background-color: var(--sur); color: #d9cdbb; }
      #rotate .d { display: flex; flex-direction: column; align-items: center; }
      #rotate .d b { display: block; font: normal clamp(26px, 8vmin, 44px) / 1.3 var(--font-title, serif); letter-spacing: 0.3em; padding-left: 0.3em; color: #f2e8d5; }
      #rotate .d span { display: block; margin-top: 0.7em; font: clamp(14px, 4vmin, 20px) / 1.5 var(--font-text, serif); letter-spacing: 0.12em; padding-left: 0.12em; color: #a99c93; }
      @media (pointer: fine) and (max-width: 479px), (pointer: fine) and (max-height: 269px) { #rotate { display: flex; } }
    </style>

    <div id="rotate">
      <div class="d"><b>窗口太小了</b><span>把窗口拉大一些</span></div>
    </div>
    <script>
      // 首次载入画面的进度与退场。window.__fsBoot.finish()：第一个界面挂上了（main.ts 调；页面上一出现别的界面这里也会自己调一次）——
      // 金线走满、淡出、移除；还没露面（有缓存，0.3 秒内就好了）的直接移除。
      // 进度：构建版按 window.__FS_LOAD 里第 0 组（首屏）各文件的字节，浏览器每下完一个（Resource Timing）就记上；
      // 开发服务器上模块不打包、清单是 null：按这台设备上一次首屏实际下了多少字节估（第一次按 3.5 MB），走到九成五停住等完成。
      (() => {
        const boot = document.getElementById("boot");
        const stage = document.getElementById("stage");
        const ln = boot.querySelector(".ln");
        const plan = window.__FS_LOAD;
        const store = (k, v) => { try { return v === undefined ? localStorage.getItem(k) : localStorage.setItem(k, v); } catch (e) { return null; } };
        if (store("fs.v1.booted")) boot.classList.add("again"); // 来过的：不写「初次入阵」
        let total = 0, got = 0, target = 0, shown = 0, finishing = false;
        const seen = new Set();
        if (plan) for (const k in plan.files) { if (plan.files[k][1] === 0) total += plan.files[k][0]; }
        else total = Number(store("fs.v1.bootBytes")) || 3.5e6;
        const take = (list) => {
          for (const e of list) {
            let path;
            try { path = new URL(e.name).pathname; } catch (_) { continue; }
            if (seen.has(path)) continue;
            seen.add(path);
            if (plan) { const f = plan.files[path]; if (f && f[1] === 0) got += f[0]; }
            else if (e.initiatorType !== "navigation") got += e.decodedBodySize || e.encodedBodySize || 0;
          }
          if (!finishing) target = Math.min(plan ? 1 : 0.95, got / total);
        };
        let po = null;
        try { po = new PerformanceObserver((l) => take(l.getEntries())); po.observe({ type: "resource", buffered: true }); } catch (_) { take(performance.getEntriesByType("resource")); }
        const half = () => ln.style.setProperty("--half", ln.clientWidth / 2 + "px");
        half();
        addEventListener("resize", half);
        let last = performance.now();
        const tick = (now) => {
          if (!boot.isConnected) return;
          // 往真实进度追（不是匀速假条）：一帧追掉差距的一成多，追得上下完一个大文件时的跳变，又不一闪
          const dt = Math.min(0.1, (now - last) / 1000);
          last = now;
          if (shown !== target) {
            shown += (target - shown) * Math.min(1, dt * (finishing ? 14 : 7));
            if (target - shown < 0.002) shown = target;
            ln.style.setProperty("--p", shown.toFixed(4)); // 只在变了的时候改（主线程这时要跑主程序，别每帧都重排）
          }
          requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
        const remove = () => { po && po.disconnect(); removeEventListener("resize", half); boot.remove(); };
        window.__fsBoot = {
          finish() {
            if (finishing || !boot.isConnected) return;
            finishing = true;
            target = 1;
            if (!plan && got > 0) store("fs.v1.bootBytes", String(Math.round(got)));
            store("fs.v1.booted", "1");
            const op = Number(getComputedStyle(boot).opacity);
            if (op < 0.05) return remove(); // 还没露面
            boot.getAnimations().forEach((a) => a.pause());
            // 线先走满（约 0.25 秒），再淡出
            setTimeout(() => boot.animate([{ opacity: op }, { opacity: 0 }], { duration: 450, easing: "ease-out", fill: "forwards" }).finished.then(remove), 260);
          },
        };
        // 保险：页面上一出现别的界面（画布进了 #stage，或 body 下多了一层界面）就收场
        const mo = new MutationObserver((list) => {
          if (!boot.isConnected) return mo.disconnect();
          const shown = list.some((m) => [...m.addedNodes].some((n) => n.nodeType === 1 && !/^(SCRIPT|STYLE|LINK)$/.test(n.nodeName)));
          if (!shown) return;
          mo.disconnect();
          window.__fsBoot.finish();
        });
        mo.observe(document.body, { childList: true });
        mo.observe(stage, { childList: true });
      })();
    </script>
