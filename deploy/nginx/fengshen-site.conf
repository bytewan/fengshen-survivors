# nginx：游戏站点的公共部分（静态页、压缩、缓存头、/relay 转给中继）。
# 被 default.conf.template（正式：https）和 local-http.conf.template（本机试：只有 http）的 server 段 include。
# 中继在 docker-compose 的内网里叫 relay（端口 5300，不对外）。

root /srv/site;
index index.html;
charset utf-8;
server_tokens off;
# 访问日志默认不记（里面有来访者的 IP）；排查问题时改成 access_log /dev/stdout;
access_log off;

# 压缩：先找预压缩好的 .gz（tools/precompress.mjs），没有再现压。字体、音频本来就压缩过，不在类型表里
gzip on;
gzip_static on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml;

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# 中继的地址：Docker 里是 compose 内网的 relay:5300，用 Docker 自带的 DNS（127.0.0.11）在请求时现查——中继还没起来、正在重启时 nginx 照样能起。
# 不用 Docker、中继直接跑在本机：把下一行换成 set $relay_upstream http://127.0.0.1:5300;（resolver 那行留着也不碍事）
set $relay_upstream http://relay:5300;
resolver 127.0.0.11 valid=10s ipv6=off;

# 中继（WebSocket）：/relay 原样转过去（中继认 /relay 前缀）
location /relay {
    proxy_pass $relay_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    # 中继按这两个头认来访的 IP（RELAY_TRUST_PROXY=1；每个 IP 的连接上限靠它）
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 客户端约 2 秒一次心跳；两分钟什么都没有才算断（默认的 60 秒也够，放宽一点给手机切后台）
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;
}

# 带内容哈希的脚本：一年不变
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}

# 字体、音频、图标、许可文本：文件名不带哈希，换版本时可能变，缓存一小时
location ~ ^/(fonts|audio|icons|licenses)/ {
    add_header Cache-Control "public, max-age=3600";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}

# 有的 nginx 的类型表里没有 .webmanifest
location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}

# 页面：每次都问一下有没有新的（ETag 没变就 304）
location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri $uri/ =404;
}
