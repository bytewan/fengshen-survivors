name: Publish game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Set site path
        env:
          CUSTOM_BASE: ${{ vars.GAME_BASE_PATH }}
        shell: bash
        run: |
          if [ -n "$CUSTOM_BASE" ]; then
            printf 'GAME_BASE_PATH=%s\n' "$CUSTOM_BASE" >> "$GITHUB_ENV"
          elif [[ "${GITHUB_REPOSITORY##*/}" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
            printf 'GAME_BASE_PATH=/\n' >> "$GITHUB_ENV"
          else
            printf 'GAME_BASE_PATH=/%s/\n' "${GITHUB_REPOSITORY##*/}" >> "$GITHUB_ENV"
          fi
      - run: npm ci
      - run: npm test
      - name: Build game
        env:
          VITE_RELAY_URL: ${{ vars.VITE_RELAY_URL }}
        run: |
          [[ "$VITE_RELAY_URL" == wss://* ]] || { echo '请先设置仓库变量 VITE_RELAY_URL（公网 wss 地址）'; exit 1; }
          npm run build
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
